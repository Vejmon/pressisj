server:
  error:
    include-stacktrace: always
  shutdown: immediate

spring:
  application:
    name: kunstner
  jpa:
    database: POSTGRESQL
    open-in-view: false
    show-sql: false
  datasource:
    username: kunstner_api_user
    password: ${DB_USER_PW}
    url: jdbc:postgresql://localhost:5432/kunstner
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 2000
      idle-timeout: 15000
      maximum-pool-size: 10
      minimum-idle: 5
  flyway:
    enabled: true
    user: kunstner_api_flyway
    password: ${FLYWAY_USER_PW}
    url: jdbc:postgresql://localhost:5432/kunstner
  security:
    user:
      name: admin
      password: ${ADMIN_USER_PW}
  mail:
    enabled: false
    message: |
      Takk for att du tar kontakt!
      Under ser du meldingen slik vi har mottat den.
      Vi svarer så fort vi kan, ha en fin dag videre.
    signatur: |
      --
      ikke svar denne mailen
    password: ${EMAIL_PW:}
    username: ${EMAIL_USER:}
    inbox: ${EMAIL_INBOX:}
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 50MB
      clean-history-on-start: true
  level:
    root: INFO

navigation:
  pages: # sets available pages in links banner
    - name: "Hjem"
      url: "/"
    - name: "Nyheter"
      url: "/nyheter"
    - name: "Kontakt"
      url: "/kontakt"

springdoc:
  show-login-endpoint: true
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

---

spring:
  config:
    activate:
      on-profile: test
  security:
    user:
      password: admin
  flyway:
    password: password
  datasource:
    password: password

---

server:
  error:
    include-stacktrace: never

spring:
  config:
    activate:
      on-profile: production

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false