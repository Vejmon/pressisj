plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version('7.1.0')
}

group = 'no.vejmon'
version = '0.0.1-SNAPSHOT'
description = 'kunstner'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    mockitoAgent
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.bundles.spring.starters
    implementation libs.bundles.db


    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation libs.bundles.test
    mockitoAgent(libs.mockito.core) {
        transitive = false
    }

}

tasks {
    test {
        systemProperty("spring.profiles.active", "test")
        jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
        useJUnitPlatform()
    }
}

tasks.register('cleanStatic', Delete) {
    delete fileTree("${projectDir}/src/main/resources/static/assets") {
        // exclude("name.jpg")
    }
}

tasks.register('cleanTemplates', Delete) {
    dependsOn cleanStatic
    delete "${projectDir}/src/main/resources/templates"
}


tasks.register('npmDoInstall', NpmTask) {
    dependsOn cleanTemplates
    workingDir = file("${projectDir}/ui")
    args = ['install']
}

tasks.register('npmBuild', NpmTask) {
    dependsOn npmDoInstall
    workingDir = file("${projectDir}/ui")
    args = ['run', 'build']
}

tasks.register('copyVueBuild', Copy) {
    dependsOn npmBuild
    into "${projectDir}/src/main/resources"

    from("${projectDir}/ui/dist") {
        exclude('mockServiceWorker.js')
        exclude('index.html')
        into 'static'
    }
    from("${projectDir}/ui/dist/index.html") {
        into 'templates'
    }
}

processResources {
    dependsOn rootProject.tasks.copyVueBuild
}

